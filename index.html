    <!-- MERES: GA4 (gtag.js) es Meta pixel. Csak az eles gazdan toltodik be
         (konyhaszakerto.hu es aldomainjei, pl. videotar.konyhaszakerto.hu).
         Vercel elonezeten es localhoston semmi nem tolt be es semmi nem megy ki.
         A page_view-t es az osszes esemenyt a src/lib/track.ts kuldi
         (egyoldalas alkalmazas), ezert send_page_view: false es nincs fbq PageView itt. -->
    <script>
      var KF_LIVE = /(^|\.)konyhaszakerto\.hu$/.test(location.hostname);
      window.__kfLive = KF_LIVE;
      if (KF_LIVE) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-M56305EC20', { send_page_view: false });
        var g = document.createElement('script');
        g.async = true;
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-M56305EC20';
        document.head.appendChild(g);

        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1556935778428846');
      }
